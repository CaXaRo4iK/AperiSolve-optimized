name: Docker Image CI

# Build-only: on a tag the image is pushed to ghcr; deploying (pull + up) is done
# by hand on the server, so no SSH secrets / `prod` environment are needed.

# Images are built only for tags (lint.yml already checks every push to main),
# so branch pushes do not burn CI minutes on a full image build.
on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  # Deploy gate: a tag must never ship code that fails lint/type/tests. Kept
  # to one Python version for speed; the full matrix (and pip-audit, which can
  # go red on advisories unrelated to the release) stays in lint.yml.
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Sync Python dependencies
        run: uv sync --frozen --extra dev

      - name: Lint, type-check and test
        run: |
          uv run ruff check .
          uv run ruff format . --check
          uv run ty check aperisolve
          uv run pytest -q --cov=aperisolve --cov-fail-under=55

  docker-releases:
    runs-on: ubuntu-latest
    needs: tests

    env:
      RELEASE_VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on tag)
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          # Layer cache across runs: only the layers a change touches rebuild.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/caxaro4ik/aperisolve-optimized:${{ env.RELEASE_VERSION }}
            ghcr.io/caxaro4ik/aperisolve-optimized:latest
